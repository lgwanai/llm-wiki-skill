[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-skill"
version = "2.0.0"
description = "LLM Wiki v2 — A pattern for building personal knowledge bases using LLMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["wiki", "knowledge-base", "llm", "claude-code", "skill", "personal-knowledge"]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "numpy>=1.24",
    "duckdb>=1.0",
    "jieba>=0.42",
    "openpyxl>=3.1",
    "markitdown>=0.1",
    "beautifulsoup4>=4.12",
    "markdownify>=1.0",
]

[project.optional-dependencies]
search = ["sentence-transformers>=2.2", "faiss-cpu>=1.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "isort>=5.12", "ruff>=0.1"]
vector = ["zvec>=0.5.1", "sentence-transformers>=2.2", "modelscope>=1.20"]
rerank = ["FlagEmbedding>=1.3"]
ocr-mineru = ["mineru[all]>=3.4.4,<4"]

[project.scripts]
wiki = "scripts.wiki:main"
llm-wiki = "scripts.wiki:main"
llm-wiki-ocr = "ocr.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/llm-wiki-skill"
Documentation = "https://github.com/anomalyco/llm-wiki-skill#readme"

[tool.setuptools.packages.find]
include = ["scripts*", "ocr*"]

[tool.setuptools.package-data]
ocr = ["mineru.json"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates intentionally preserve readable source lines; compile_v2 also
# has a compatibility import after path bootstrapping for direct script execution.
"scripts/compile_v2.py" = ["E402", "E501"]
"scripts/crystallize.py" = ["E402", "E501"]
"scripts/lint.py" = ["E402", "E501"]
"scripts/ledger.py" = ["E501"]
"scripts/dream.py" = ["E501", "N818"]
"scripts/_dream_auto.py" = ["E402"]
"scripts/query.py" = ["E501"]
"scripts/search.py" = ["E501"]
"scripts/wiki.py" = ["E501"]
"tests/test_ingest.py" = ["E501"]
"tests/test_lint.py" = ["E501"]
"tests/test_ledger.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
